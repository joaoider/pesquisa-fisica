[project]
name = "pesquisa-fisica"
version = "0.8.0"
description = "Gravidade emergente das três forças (gravidade induzida) com bateria de testes T0–T3"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
